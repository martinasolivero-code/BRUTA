<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Cupo Reservado! - BRUTA.</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Arial, sans-serif;
        }
        :root {
            --color-black: #0D0E0E;
            --color-zinc-dark: #141616;
            --color-military-green: #3B4735;
            --color-bright-green: #8CE65C;
            --color-white: #FFFFFF;
            --color-gray-text: #A6AFA6;
        }
        body {
            background-color: var(--color-black);
            color: var(--color-white);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
        }
        .success-card {
            background-color: var(--color-zinc-dark);
            border: 2px solid var(--color-military-green);
            border-radius: 8px;
            padding: 55px 45px;
            max-width: 520px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0,0,0,0.6);
            transition: border-color 0.3s ease;
        }
        .success-card:hover {
            border-color: var(--color-bright-green);
        }
        .icon {
            font-size: 64px;
            color: var(--color-bright-green);
            margin-bottom: 20px;
            line-height: 1;
            text-shadow: 0 0 20px rgba(140, 230, 92, 0.3);
        }
        h1 {
            font-size: 32px;
            font-weight: 900;
            text-transform: uppercase;
            margin-bottom: 16px;
            letter-spacing: -0.5px;
        }
        p {
            font-size: 17px; /* +15% */
            color: var(--color-gray-text);
            line-height: 1.6;
            margin-bottom: 36px;
        }
        .badge {
            display: inline-block;
            background-color: #232A1F;
            border: 2px solid var(--color-bright-green);
            padding: 14px 28px;
            border-radius: 4px;
            font-size: 14px; /* +15% */
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--color-white);
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        .badge:hover {
            background-color: var(--color-bright-green);
            color: var(--color-black);
            border-color: var(--color-white);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(140, 230, 92, 0.3);
        }
    </style>
</head>
<body>

    <div class="success-card">
        <div class="icon">✓</div>
        <h1>¡Registro Confirmado!</h1>
        <p>Aseguraste tu prioridad en la lista de <strong>Socios Fundadores</strong> para el desembarco en Villa Urquiza.<br><br>Te vamos a contactar por WhatsApp antes de la apertura oficial para mantener tu precio promocional congelado.</p>
        <a href="https://martinasolivero-code.github.io/BRUTA/" class="badge">Volver a la web</a>
    </div>

</body>
</html>
